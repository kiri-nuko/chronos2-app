

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#111d49">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="クロノス管理">

<title>クロノス管理</title>

<style>

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

}

:root {

  --edge: 7px;

  --gap: 5px;

  --clock-size: 350px;

  --hp-size: 38px;

  --hp-button-height: 35px;

  --move-height: 42px;

  --reset-height: 34px;

  --panel-padding: 6px;

}

html,

body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #111d49;

}

body {

  color: white;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Kaku Gothic ProN",

    sans-serif;

  -webkit-text-size-adjust: 100%;

}

button {

  appearance: none;

  -webkit-appearance: none;

  font: inherit;

  color: white;

  cursor: pointer;

  touch-action: manipulation;

  user-select: none;

  -webkit-user-select: none;

}

button:active {

  filter: brightness(1.3);

}

#viewport {

  position: fixed;

  inset: 0;

  overflow: hidden;

  background: linear-gradient(

    180deg,

    #111d49 0%,

    #202f69 100%

  );

}

#app {

  position: absolute;

  left: 0;

  top: 0;

  width: 100%;

  padding: 0 var(--edge);

  display: flex;

  flex-direction: column;

  align-items: stretch;

  gap: var(--gap);

}

/* タイトル */

h1 {

  margin: 0;

  text-align: center;

  color: #f3e9d3;

  font-size: 18px;

  line-height: 1.25;

  font-weight: 650;

  letter-spacing: 3px;

  flex-shrink: 0;

}

/* HP管理エリア */

.player {

  width: 100%;

  background: #2e4087;

  border: 1px solid #91a2d0;

  border-radius: 12px;

  padding: var(--panel-padding);

  text-align: center;

  flex-shrink: 0;

}

/* プレイヤー1は全体を180度回転 */

.player.one {

  transform: rotate(180deg);

}

.player-name {

  color: #f3e9d3;

  font-size: 14px;

  line-height: 1.15;

}

.hp {

  font-size: var(--hp-size);

  line-height: 1;

  font-weight: 750;

  margin: 2px 0 5px;

  font-variant-numeric: tabular-nums;

}

/* HP操作ボタン */

.hp-buttons {

  display: grid;

  grid-template-columns: repeat(4,minmax(0,1fr));

  gap: 5px;

  width: 100%;

}

.hp-buttons button {

  min-width: 0;

  width: 100%;

  height: var(--hp-button-height);

  padding: 0 2px;

  border: 1px solid #a3b2db;

  border-radius: 8px;

  background: #4b62a4;

  font-size: 16px;

  line-height: 1;

  white-space: nowrap;

}

/* クロノスエリア */

.clock-area {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 2px;

  flex-shrink: 0;

}

.clock-label {

  font-size: 12px;

  color: #e0e7fb;

  line-height: 1.15;

}

#clock {

  display: block;

  width: var(--clock-size);

  height: var(--clock-size);

  max-width: 100%;

  overflow: visible;

  flex-shrink: 0;

  touch-action: manipulation;

}

/* 移動ボタン */

.move-buttons {

  display: grid;

  grid-template-columns: repeat(2,minmax(0,1fr));

  gap: 10px;

  width: 82%;

  margin: 0 auto;

  flex-shrink: 0;

}

.move-buttons button {

  min-width: 0;

  height: var(--move-height);

  border: 1px solid #a3b2db;

  border-radius: 9px;

  background: #4b62a4;

  font-size: 16px;

  white-space: nowrap;

}

/* リセット */

.reset-wrap {

  text-align: center;

  flex-shrink: 0;

}

#reset {

  min-width: 145px;

  height: var(--reset-height);

  padding: 0 16px;

  border: 1px solid #a3b2db;

  border-radius: 9px;

  background: #4b62a4;

  font-size: 14px;

  white-space: nowrap;

}

svg text {

  pointer-events: none;

  user-select: none;

}

.clock-mark {

  cursor: pointer;

}

@media (max-width: 360px) {

  :root {

    --edge: 5px;

  }

  .hp-buttons {

    gap: 3px;

  }

  .hp-buttons button {

    font-size: 14px;

  }

  .move-buttons {

    width: 90%;

  }

}

</style>

</head>

<body>

<div id="viewport">

<main id="app">

  <h1>クロノス管理</h1>

  <!-- プレイヤー1 -->

  <section class="player one">

    <div class="player-name">

      プレイヤー1

    </div>

    <div class="hp" id="hp1">

      100

    </div>

    <div class="hp-buttons">

      <button type="button" data-player="0" data-delta="-20">−20</button>

      <button type="button" data-player="0" data-delta="-10">−10</button>

      <button type="button" data-player="0" data-delta="10">＋10</button>

      <button type="button" data-player="0" data-delta="20">＋20</button>

    </div>

  </section>

  <!-- クロノス -->

  <section class="clock-area">

    <div class="clock-label">

      現在のクロノス

    </div>

    <svg

      id="clock"

      viewBox="0 0 360 360"

      xmlns="http://www.w3.org/2000/svg"

      aria-label="クロノス盤">

    </svg>

  </section>

  <!-- 移動 -->

  <div class="move-buttons">

    <button type="button" id="back">

      ◀ 戻る

    </button>

    <button type="button" id="forward">

      進む ▶

    </button>

  </div>

  <!-- プレイヤー2 -->

  <section class="player">

    <div class="player-name">

      プレイヤー2

    </div>

    <div class="hp" id="hp2">

      100

    </div>

    <div class="hp-buttons">

      <button type="button" data-player="1" data-delta="-20">−20</button>

      <button type="button" data-player="1" data-delta="-10">−10</button>

      <button type="button" data-player="1" data-delta="10">＋10</button>

      <button type="button" data-player="1" data-delta="20">＋20</button>

    </div>

  </section>

  <!-- リセット -->

  <div class="reset-wrap">

    <button type="button" id="reset">

      すべてリセット

    </button>

  </div>

</main>

</div>

<script>

"use strict";

/* ==================================

   ゲーム状態

================================== */

let hp = [100, 100];

// 初期位置：夜5/9（真夜中）

let position = 4;

const svg = document.getElementById("clock");

const NS = "http://www.w3.org/2000/svg";

const COLORS = {

  background: "#111d49",

  line: "#9baad3",

  gold: "#f4d78e",

  orange: "#ffb166",

  night: "#0b1534"

};

/* ==================================

   SVG作成

================================== */

function createSVG(tag, attrs = {}, parent = svg) {

  const element =

    document.createElementNS(NS, tag);

  for (const [key, value] of Object.entries(attrs)) {

    element.setAttribute(key, value);

  }

  parent.appendChild(element);

  return element;

}

/* ==================================

   グラデーション

================================== */

const defs = createSVG("defs");

const moonGradient = createSVG("radialGradient", {

  id: "moonGradient",

  cx: "35%",

  cy: "30%",

  r: "75%"

}, defs);

createSVG("stop", {

  offset: "0%",

  "stop-color": "#fff6cb"

}, moonGradient);

createSVG("stop", {

  offset: "70%",

  "stop-color": "#f0d48b"

}, moonGradient);

createSVG("stop", {

  offset: "100%",

  "stop-color": "#ba873c"

}, moonGradient);

const sunGradient = createSVG("radialGradient", {

  id: "sunGradient"

}, defs);

createSVG("stop", {

  offset: "0%",

  "stop-color": "#fff2ad"

}, sunGradient);

createSVG("stop", {

  offset: "100%",

  "stop-color": "#ffc05e"

}, sunGradient);

/* ==================================

   クロノス盤

================================== */

createSVG("circle", {

  cx: 180,

  cy: 180,

  r: 173,

  fill: "none",

  stroke: COLORS.line,

  "stroke-width": 1.3

});

createSVG("path", {

  d: "M 7 180 H 353",

  stroke: COLORS.line,

  "stroke-width": 0.8,

  opacity: 0.5

});

createSVG("circle", {

  cx: 180,

  cy: 180,

  r: 102,

  fill: COLORS.background,

  stroke: COLORS.line,

  "stroke-width": 1.3

});

/* ==================================

   星

================================== */

[

  [145,116],

  [172,131],

  [209,117],

  [121,144],

  [239,144],

  [125,210],

  [232,210]

].forEach(([x,y]) => {

  createSVG("circle", {

    cx: x,

    cy: y,

    r: 1.1,

    fill: "#d7dcf3"

  });

});

/* ==================================

   月の満ち欠け

================================== */

function drawMoon(group, index) {

  const radius = 12.5;

  createSVG("circle", {

    r: radius,

    fill: COLORS.night,

    stroke: "#66749a",

    "stroke-width": 0.6

  }, group);

  // 夜9：新月

  if (index === 8) {

    return;

  }

  // 夜5：満月

  if (index === 4) {

    createSVG("circle", {

      r: radius,

      fill: "url(#moonGradient)"

    }, group);

    return;

  }

  const phase = index / 8;

  const illumination =

    (1 - Math.cos(2 * Math.PI * phase)) / 2;

  const terminator =

    Math.abs(1 - 2 * illumination) * radius;

  const waxing = index < 4;

  let d;

  if (waxing) {

    d = [

      `M 0 ${-radius}`,

      `A ${radius} ${radius} 0 0 1 0 ${radius}`,

      `A ${Math.max(0.01,terminator)} ${radius} 0 0 ${illumination < 0.5 ? 0 : 1} 0 ${-radius}`,

      "Z"

    ].join(" ");

  } else {

    d = [

      `M 0 ${-radius}`,

      `A ${radius} ${radius} 0 0 0 0 ${radius}`,

      `A ${Math.max(0.01,terminator)} ${radius} 0 0 ${illumination < 0.5 ? 1 : 0} 0 ${-radius}`,

      "Z"

    ].join(" ");

  }

  createSVG("path", {

    d,

    fill: "url(#moonGradient)"

  }, group);

}

/* ==================================

   太陽の変化

================================== */

function drawSun(group, dayIndex) {

  const distanceFromNoon =

    Math.abs(dayIndex - 4);

  const heightRatio =

    1 - distanceFromNoon / 4;

  const color =

    distanceFromNoon >= 3

      ? COLORS.orange

      : COLORS.gold;

  // 昼5/9（正午）は従来のUI

  if (dayIndex !== 4) {

    createSVG("line", {

      x1: -18,

      y1: 11,

      x2: 18,

      y2: 11,

      stroke: color,

      "stroke-width": 1.7

    }, group);

  }

  const radius =

    5 + heightRatio * 4;

  const sunY =

    10 - heightRatio * 10;

  const sunGroup = createSVG("g", {

    transform: `translate(0 ${sunY})`

  }, group);

  createSVG("circle", {

    r: radius,

    fill: dayIndex === 4

      ? "url(#sunGradient)"

      : color

  }, sunGroup);

  for (let j = 0; j < 8; j++) {

    const angle =

      j * Math.PI / 4;

    const inner =

      radius + 3;

    const outer =

      radius + 7;

    const x1 =

      Math.cos(angle) * inner;

    const y1 =

      Math.sin(angle) * inner;

    const x2 =

      Math.cos(angle) * outer;

    const y2 =

      Math.sin(angle) * outer;

    if (

      distanceFromNoon >= 3 &&

      y2 > 0

    ) {

      continue;

    }

    createSVG("line", {

      x1, y1, x2, y2,

      stroke: color,

      "stroke-width": 1.8,

      "stroke-linecap": "round"

    }, sunGroup);

  }

}

/* ==================================

   18マス

================================== */

const marks = [];

for (let i = 0; i < 18; i++) {

  const angle =

    (-80 + i * 20) * Math.PI / 180;

  const x =

    180 + 146 * Math.sin(angle);

  const y =

    180 - 146 * Math.cos(angle);

  const group = createSVG("g", {

    transform: `translate(${x} ${y})`,

    class: "clock-mark"

  });

  const halo = createSVG("circle", {

    r: 23,

    fill: "none",

    stroke: "none",

    "stroke-width": 2.5

  }, group);

  marks.push(halo);

  if (i < 9) {

    drawMoon(group, i);

  } else {

    drawSun(group, i - 9);

  }

  createSVG("circle", {

    r: 23,

    fill: "transparent"

  }, group);

  group.addEventListener("click", () => {

    position = i;

    render();

  });

}

/* ==================================

   中央表示

================================== */

const centerObject =

  createSVG("g");

const centerSymbol =

  createSVG("g", {}, centerObject);

const phaseLabel = createSVG("text", {

  x: 180,

  y: 236,

  fill: "#f2e6d1",

  "font-size": 17,

  "text-anchor": "middle"

}, centerObject);

const phaseNumber = createSVG("text", {

  x: 180,

  y: 265,

  fill: "#ffffff",

  "font-size": 23,

  "text-anchor": "middle"

}, centerObject);

function drawCenterSymbol() {

  centerSymbol.replaceChildren();

  const isNight =

    position < 9;

  const index =

    isNight

      ? position

      : position - 9;

  const group = createSVG("g", {

    transform:

      "translate(180 174) scale(2.25)"

  }, centerSymbol);

  if (isNight) {

    drawMoon(group, index);

  } else {

    drawSun(group, index);

  }

}

/* ==================================

   表示更新

================================== */

function render() {

  document.getElementById("hp1")

    .textContent = hp[0];

  document.getElementById("hp2")

    .textContent = hp[1];

  marks.forEach((halo,i) => {

    if (i === position) {

      halo.setAttribute(

        "stroke",

        COLORS.gold

      );

      halo.setAttribute(

        "fill",

        "#f4d78e18"

      );

    } else {

      halo.setAttribute(

        "stroke",

        "none"

      );

      halo.setAttribute(

        "fill",

        "none"

      );

    }

  });

  const isNight =

    position < 9;

  const number =

    isNight

      ? position + 1

      : position - 8;

  phaseLabel.textContent =

    isNight ? "夜" : "昼";

  if (number === 5) {

    phaseNumber.textContent =

      isNight

        ? "真夜中"

        : "正午";

  } else {

    phaseNumber.textContent =

      `${number} / 9`;

  }

  drawCenterSymbol();

}

/* ==================================

   HP操作

================================== */

document.querySelectorAll(

  "[data-player]"

).forEach(button => {

  button.addEventListener(

    "click",

    () => {

      const player =

        Number(button.dataset.player);

      const delta =

        Number(button.dataset.delta);

      hp[player] = Math.max(

        0,

        Math.min(

          100,

          hp[player] + delta

        )

      );

      render();

    }

  );

});

/* ==================================

   左右移動

================================== */

document.getElementById("back")

  .addEventListener("click", () => {

    position =

      (position + 17) % 18;

    render();

  });

document.getElementById("forward")

  .addEventListener("click", () => {

    position =

      (position + 1) % 18;

    render();

  });

/* ==================================

   リセット

================================== */

document.getElementById("reset")

  .addEventListener("click", () => {

    hp = [100,100];

    position = 4;

    render();

  });

/* ==================================

   画面サイズ自動調整

   HPエリアを小さくし

   クロノスを優先して拡大

================================== */

const app =

  document.getElementById("app");

const viewport =

  document.getElementById("viewport");

function setVariable(name,value) {

  document.documentElement.style

    .setProperty(name,value);

}

function fitScreen() {

  const screenWidth =

    viewport.clientWidth;

  const screenHeight =

    window.visualViewport

      ? window.visualViewport.height

      : viewport.clientHeight;

  const availableHeight =

    screenHeight - 10;

  const availableWidth =

    screenWidth - 4;

  // コンパクトなHPパネルを基本にする

  setVariable("--edge","7px");

  setVariable("--gap","5px");

  setVariable("--panel-padding","6px");

  setVariable("--hp-size","38px");

  setVariable("--hp-button-height","35px");

  setVariable("--move-height","42px");

  setVariable("--reset-height","34px");

  app.style.width =

    screenWidth + "px";

  app.style.transform = "none";

  app.style.left = "0px";

  app.style.top = "0px";

  // 横幅いっぱいに近い盤サイズ

  const maxClock = Math.min(

    availableWidth - 10,

    470

  );

  setVariable(

    "--clock-size",

    maxClock + "px"

  );

  // まず盤以外が占める高さを計測

  const fullHeight =

    app.scrollHeight;

  const otherHeight =

    fullHeight - maxClock;

  // 盤に使える縦方向の最大スペース

  let clockSize = Math.min(

    maxClock,

    availableHeight - otherHeight

  );

  // 極端に小さくしない

  clockSize = Math.max(

    180,

    clockSize

  );

  setVariable(

    "--clock-size",

    clockSize + "px"

  );

  let contentHeight =

    app.scrollHeight;

  // それでも高さ不足なら余白を圧縮

  if (contentHeight > availableHeight) {

    setVariable("--gap","3px");

    setVariable("--panel-padding","4px");

    setVariable("--hp-size","34px");

    setVariable("--hp-button-height","32px");

    setVariable("--move-height","38px");

    setVariable("--reset-height","32px");

    // 圧縮で生まれたスペースを盤に戻す

    const heightAfterCompact =

      app.scrollHeight;

    const freeSpace =

      availableHeight - heightAfterCompact;

    clockSize = Math.min(

      maxClock,

      clockSize + Math.max(0,freeSpace)

    );

    setVariable(

      "--clock-size",

      clockSize + "px"

    );

  }

  contentHeight =

    app.scrollHeight;

  // 最終的な安全調整

  const scale = Math.min(

    1,

    availableHeight / contentHeight

  );

  app.style.transformOrigin =

    "top left";

  app.style.transform =

    `scale(${scale})`;

  const finalWidth =

    screenWidth * scale;

  const finalHeight =

    contentHeight * scale;

  app.style.left =

    ((screenWidth - finalWidth) / 2)

    + "px";

  app.style.top =

    ((screenHeight - finalHeight) / 2)

    + "px";

}

/* ==================================

   画面変更時の再計算

================================== */

let fitFrame = null;

function requestFit() {

  if (fitFrame !== null) {

    cancelAnimationFrame(fitFrame);

  }

  fitFrame = requestAnimationFrame(() => {

    fitFrame = null;

    fitScreen();

  });

}

window.addEventListener(

  "resize",

  requestFit

);

if (window.visualViewport) {

  window.visualViewport.addEventListener(

    "resize",

    requestFit

  );

}

window.addEventListener(

  "orientationchange",

  requestFit

);

render();

requestFit();

</script>

</body>

</html>
