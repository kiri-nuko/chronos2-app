

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#101e49">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="クロノス管理">

<title>クロノス管理</title>

<style>

* {

  box-sizing: border-box;

}

:root {

  --page-height: 100dvh;

  --clock-size: min(88vw, 350px, 39dvh);

  --gap: 8px;

  --panel-padding: 10px;

  --hp-size: 46px;

  --button-height: 43px;

}

html {

  margin: 0;

  min-height: 100%;

  background: #101e49;

}

body {

  margin: 0;

  min-height: var(--page-height);

  padding:

    max(5px, env(safe-area-inset-top))

    10px

    max(8px, env(safe-area-inset-bottom));

  background: linear-gradient(

    180deg,

    #101e49 0%,

    #1b3171 100%

  );

  color: #f5e9cb;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Helvetica Neue",

    sans-serif;

  text-align: center;

  -webkit-text-size-adjust: 100%;

}

.app {

  width: 100%;

  max-width: 460px;

  min-height: calc(

    var(--page-height) -

    env(safe-area-inset-top) -

    env(safe-area-inset-bottom) -

    13px

  );

  margin: 0 auto;

  display: flex;

  flex-direction: column;

  align-items: stretch;

  justify-content: center;

  gap: var(--gap);

}

h1 {

  margin: 0;

  font-size: 17px;

  font-weight: 650;

  letter-spacing: 3px;

  line-height: 1.4;

}

.panel {

  width: 100%;

  padding: var(--panel-padding);

  background: #293b85;

  border: 1px solid #8e9dcb;

  border-radius: 13px;

  flex-shrink: 0;

}

/* プレイヤー1は対面用に180度回転 */

.player-one {

  transform: rotate(180deg);

}

.player-name {

  font-size: 16px;

  line-height: 1.2;

}

.hp {

  margin: 3px 0 6px;

  color: #fff;

  font-size: var(--hp-size);

  line-height: 1.05;

  font-weight: 750;

  font-variant-numeric: tabular-nums;

}

.hp-controls {

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 6px;

  width: 100%;

}

button {

  appearance: none;

  -webkit-appearance: none;

  display: flex;

  align-items: center;

  justify-content: center;

  background: #465a9c;

  color: #fff;

  border: 1px solid #aab8e0;

  border-radius: 9px;

  font-family: inherit;

  font-weight: 500;

  cursor: pointer;

  touch-action: manipulation;

  -webkit-tap-highlight-color: transparent;

}

button:active {

  background: #8094d1;

}

.hp-controls button {

  width: 100%;

  min-width: 0;

  height: var(--button-height);

  padding: 0 2px;

  font-size: 16px;

  line-height: 1;

  white-space: nowrap;

  word-break: keep-all;

  overflow-wrap: normal;

  letter-spacing: -0.3px;

}

.clock-section {

  display: flex;

  flex-direction: column;

  align-items: center;

  gap: 2px;

  flex-shrink: 0;

}

.clock-caption {

  font-size: 12px;

  color: #d4def5;

  line-height: 1.3;

}

#clock {

  display: block;

  width: var(--clock-size);

  height: var(--clock-size);

  max-width: 100%;

  overflow: visible;

  flex-shrink: 0;

}

.move {

  display: flex;

  justify-content: center;

  gap: 14px;

  flex-shrink: 0;

}

.move button {

  width: min(39%, 155px);

  height: var(--button-height);

  font-size: 16px;

  white-space: nowrap;

}

.footer {

  display: flex;

  justify-content: center;

  flex-shrink: 0;

}

.reset {

  min-height: 36px;

  padding: 7px 18px;

  font-size: 13px;

  white-space: nowrap;

}

/* 画面の高さが低いiPhoneやSafari用 */

@media (max-height: 850px) {

  :root {

    --clock-size: min(82vw, 305px, 36dvh);

    --gap: 6px;

    --panel-padding: 8px;

    --hp-size: 39px;

    --button-height: 38px;

  }

  h1 {

    font-size: 15px;

  }

  .player-name {

    font-size: 14px;

  }

  .hp-controls button {

    font-size: 15px;

  }

  .move button {

    font-size: 15px;

  }

}

/* Safariのアドレスバーで表示領域が狭い場合 */

@media (max-height: 700px) {

  :root {

    --clock-size: min(76vw, 260px, 34dvh);

    --gap: 4px;

    --panel-padding: 6px;

    --hp-size: 34px;

    --button-height: 34px;

  }

  h1 {

    font-size: 14px;

  }

  .player-name {

    font-size: 13px;

  }

  .hp {

    margin: 1px 0 4px;

  }

  .hp-controls button {

    font-size: 14px;

  }

  .reset {

    min-height: 30px;

    padding: 5px 14px;

  }

}

/* 横幅が狭い端末でもHPボタンは1行 */

@media (max-width: 360px) {

  .hp-controls {

    gap: 4px;

  }

  .hp-controls button {

    font-size: 14px;

    padding: 0 1px;

  }

}

</style>

</head>

<body>

<main class="app">

  <h1>クロノス管理</h1>

  <!-- プレイヤー1：180度回転 -->

  <section class="panel player-one">

    <div class="player-name">プレイヤー1</div>

    <div class="hp" id="hp0">100</div>

    <div class="hp-controls">

      <button type="button" data-hp="0" data-delta="-20">−20</button>

      <button type="button" data-hp="0" data-delta="-10">−10</button>

      <button type="button" data-hp="0" data-delta="10">＋10</button>

      <button type="button" data-hp="0" data-delta="20">＋20</button>

    </div>

  </section>

  <section class="clock-section">

    <div class="clock-caption">現在のクロノス</div>

    <svg

      id="clock"

      viewBox="0 0 360 360"

      role="img"

      aria-label="クロノス18マス"

    ></svg>

  </section>

  <div class="move">

    <button type="button" id="back">◀ 戻る</button>

    <button type="button" id="forward">進む ▶</button>

  </div>

  <!-- プレイヤー2 -->

  <section class="panel">

    <div class="player-name">プレイヤー2</div>

    <div class="hp" id="hp1">100</div>

    <div class="hp-controls">

      <button type="button" data-hp="1" data-delta="-20">−20</button>

      <button type="button" data-hp="1" data-delta="-10">−10</button>

      <button type="button" data-hp="1" data-delta="10">＋10</button>

      <button type="button" data-hp="1" data-delta="20">＋20</button>

    </div>

  </section>

  <div class="footer">

    <button type="button" class="reset" id="reset">

      すべてリセット

    </button>

  </div>

</main>

<script>

(function () {

  "use strict";

  const STORAGE_KEY = "chronos-state-v1";

  let hp = [100, 100];

  // 初期位置：夜5（真夜中）

  let pos = 4;

  // 保存済みの状態を復元

  try {

    const saved = JSON.parse(

      localStorage.getItem(STORAGE_KEY)

    );

    if (saved) {

      if (

        Array.isArray(saved.hp) &&

        saved.hp.length === 2

      ) {

        hp = saved.hp.map(function (value) {

          const n = Number(value);

          return Number.isFinite(n)

            ? Math.max(0, Math.min(100, n))

            : 100;

        });

      }

      if (

        Number.isInteger(saved.pos) &&

        saved.pos >= 0 &&

        saved.pos < 18

      ) {

        pos = saved.pos;

      }

    }

  } catch (error) {}

  function saveState() {

    try {

      localStorage.setItem(

        STORAGE_KEY,

        JSON.stringify({

          hp: hp,

          pos: pos

        })

      );

    } catch (error) {}

  }

  const ns = "http://www.w3.org/2000/svg";

  const svg = document.getElementById("clock");

  function el(tag, attrs, parent = svg) {

    const element = document.createElementNS(ns, tag);

    for (const key in attrs) {

      element.setAttribute(key, attrs[key]);

    }

    parent.appendChild(element);

    return element;

  }

  // グラデーション設定

  const defs = el("defs", {});

  function gradient(id, colors) {

    const g = el("linearGradient", {

      id: id,

      x1: "0%",

      y1: "0%",

      x2: "0%",

      y2: "100%"

    }, defs);

    colors.forEach(function (color, index) {

      el("stop", {

        offset:

          (index / (colors.length - 1) * 100) + "%",

        "stop-color": color

      }, g);

    });

  }

  gradient("day1", [

    "#07132d", "#283b65", "#e07b55"

  ]);

  gradient("day2", [

    "#263d73", "#d66b66", "#ffc16b"

  ]);

  gradient("day3", [

    "#468cc3", "#8fc7dc", "#ffe0a1"

  ]);

  gradient("day4", [

    "#2b8bd0", "#80c7eb", "#d5eefa"

  ]);

  gradient("day6", [

    "#398bc9", "#7dbbdf", "#d7e9f4"

  ]);

  gradient("day7", [

    "#456ca1", "#eaa064", "#f8c06e"

  ]);

  gradient("day8", [

    "#493b70", "#cc5a65", "#ff9b52"

  ]);

  gradient("day9", [

    "#101e43", "#42385d", "#ad5265"

  ]);

  const moonGradient = el("radialGradient", {

    id: "moonGlow"

  }, defs);

  el("stop", {

    offset: "0%",

    "stop-color": "#fff6c8"

  }, moonGradient);

  el("stop", {

    offset: "70%",

    "stop-color": "#f2d99a"

  }, moonGradient);

  el("stop", {

    offset: "100%",

    "stop-color": "#d7b66f"

  }, moonGradient);

  const sunGradient = el("radialGradient", {

    id: "sunGlow"

  }, defs);

  el("stop", {

    offset: "0%",

    "stop-color": "#fff7bf"

  }, sunGradient);

  el("stop", {

    offset: "65%",

    "stop-color": "#ffda69"

  }, sunGradient);

  el("stop", {

    offset: "100%",

    "stop-color": "#ff9c36"

  }, sunGradient);

  // クロノスの外周

  el("circle", {

    cx: 180,

    cy: 180,

    r: 176,

    fill: "#172755",

    stroke: "#9badd7",

    "stroke-width": 1.5

  });

  // 昼夜の境界線

  el("line", {

    x1: 7,

    y1: 180,

    x2: 353,

    y2: 180,

    stroke: "#7286ba",

    "stroke-opacity": ".45"

  });

  // 月の満ち欠け

  function moonPhase(parent, index, radius) {

    const illuminated =

      (1 - Math.cos(2 * Math.PI * index / 8)) / 2;

    el("circle", {

      r: radius,

      fill: "#0c1734",

      stroke: "#b3c1d9",

      "stroke-opacity": ".45",

      "stroke-width": ".7"

    }, parent);

    if (illuminated < .01) {

      return;

    }

    if (illuminated > .99) {

      el("circle", {

        r: radius,

        fill: "url(#moonGlow)"

      }, parent);

      return;

    }

    const waxing = index < 4;

    const rx = Math.abs(1 - 2 * illuminated) * radius;

    const sweepOuter = waxing ? 1 : 0;

    const sweepInner = illuminated < .5

      ? (waxing ? 0 : 1)

      : (waxing ? 1 : 0);

    const d =

      "M 0 " + (-radius) +

      " A " + radius + " " + radius +

      " 0 0 " + sweepOuter +

      " 0 " + radius +

      " A " + rx + " " + radius +

      " 0 0 " + sweepInner +

      " 0 " + (-radius) + " Z";

    el("path", {

      d: d,

      fill: "url(#moonGlow)"

    }, parent);

  }

  // 太陽

  function sun(parent, radius) {

    for (let j = 0; j < 8; j++) {

      const angle = j * Math.PI / 4;

      el("line", {

        x1: (radius + 3) * Math.sin(angle),

        y1: -(radius + 3) * Math.cos(angle),

        x2: (radius + 10) * Math.sin(angle),

        y2: -(radius + 10) * Math.cos(angle),

        stroke: "#ffd56c",

        "stroke-width": 2.5,

        "stroke-linecap": "round"

      }, parent);

    }

    el("circle", {

      r: radius,

      fill: "url(#sunGlow)"

    }, parent);

  }

  // 昼の1〜9マスの太陽

  function drawSunStage(parent, stage) {

    // 昼5/9の太陽は維持

    if (stage === 5) {

      sun(parent, 9);

      return;

    }

    const distance = Math.abs(stage - 5);

    const radius = 9 - distance;

    const sunY = distance * 2.8;

    const group = el("g", {

      transform: "translate(0 " + sunY + ")"

    }, parent);

    const rays =

      (stage === 1 || stage === 9) ? 4 : 8;

    const rayLength =

      (stage === 2 || stage === 8) ? 5 : 8;

    for (let j = 0; j < rays; j++) {

      const angle = j / rays * Math.PI * 2;

      el("line", {

        x1: (radius + 3) * Math.sin(angle),

        y1: -(radius + 3) * Math.cos(angle),

        x2: (radius + rayLength) * Math.sin(angle),

        y2: -(radius + rayLength) * Math.cos(angle),

        stroke:

          (stage <= 3 || stage >= 7)

            ? "#ffab60"

            : "#ffda76",

        "stroke-width": 2,

        "stroke-linecap": "round"

      }, group);

    }

    el("circle", {

      r: radius,

      fill:

        (stage <= 3 || stage >= 7)

          ? "#ffad62"

          : "#ffe18b"

    }, group);

    // 日の出・日没の地平線

    if (

      stage === 1 ||

      stage === 2 ||

      stage === 8 ||

      stage === 9

    ) {

      const horizonY =

        (stage === 1 || stage === 9) ? 0 : 6;

      el("rect", {

        x: -23,

        y: horizonY,

        width: 46,

        height: 24,

        fill: "#172755"

      }, group);

      el("line", {

        x1: -20,

        y1: horizonY,

        x2: 20,

        y2: horizonY,

        stroke: "#ffb978",

        "stroke-width": 1.5

      }, group);

    }

  }

  // クロノス18マス

  for (let k = 0; k < 18; k++) {

    const angle = (-80 + k * 20) * Math.PI / 180;

    const x = 180 + 145 * Math.sin(angle);

    const y = 180 - 145 * Math.cos(angle);

    const group = el("g", {

      transform:

        "translate(" + x + " " + y + ")",

      id: "mark" + k

    });

    el("circle", {

      r: 24,

      fill: "transparent",

      stroke: "transparent",

      id: "halo" + k

    }, group);

    if (k < 9) {

      moonPhase(group, k, 13);

    } else {

      drawSunStage(group, k - 8);

    }

    el("circle", {

      r: 23,

      fill: "transparent",

      style: "pointer-events:all"

    }, group);

    group.addEventListener("click", function () {

      pos = k;

      render();

    });

  }

  // 中央の円

  el("circle", {

    cx: 180,

    cy: 180,

    r: 102,

    fill: "#101e46",

    stroke: "#91a4cf",

    "stroke-width": 1.5

  });

  const scene = el("g", {

    id: "scene"

  });

  const label = el("text", {

    x: 180,

    y: 229,

    "text-anchor": "middle",

    fill: "#f0e6d1",

    "font-size": 18

  });

  const count = el("text", {

    x: 180,

    y: 257,

    "text-anchor": "middle",

    fill: "#ffffff",

    "font-size": 23

  });

  function clearScene() {

    while (scene.firstChild) {

      scene.removeChild(scene.firstChild);

    }

  }

  // 夜の中央表示

  function drawNight(index) {

    el("circle", {

      cx: 180,

      cy: 180,

      r: 95,

      fill: "#101e46"

    }, scene);

    const stars = [

      [119, 137],

      [145, 110],

      [211, 111],

      [244, 143],

      [123, 187],

      [237, 188],

      [162, 126],

      [198, 153]

    ];

    stars.forEach(function (p) {

      el("circle", {

        cx: p[0],

        cy: p[1],

        r: 1.3,

        fill: "#e8efff",

        opacity: ".8"

      }, scene);

    });

    const moonGroup = el("g", {

      transform: "translate(180 166)"

    }, scene);

    moonPhase(moonGroup, index, 39);

  }

  // 雲

  function cloud(x, y, opacity) {

    el("path", {

      d:

        "M " + (x - 24) + " " + y +

        " Q " + (x - 14) + " " + (y - 12) +

        " " + x + " " + (y - 5) +

        " Q " + (x + 12) + " " + (y - 17) +

        " " + (x + 24) + " " + y,

      fill: "none",

      stroke: "#ffffff",

      "stroke-width": 5,

      "stroke-linecap": "round",

      opacity: opacity

    }, scene);

  }

  // 昼の中央表示

  function drawDay(index) {

    const stage = index + 1;

    // 昼5/9：従来の正午UIを維持

    if (stage === 5) {

      el("circle", {

        cx: 180,

        cy: 180,

        r: 95,

        fill: "#448fca"

      }, scene);

      el("path", {

        d:

          "M 100 202 Q 145 190 180 201 " +

          "Q 219 191 260 203 " +

          "L 260 219 L 100 219 Z",

        fill: "#26476d"

      }, scene);

      const sunGroup = el("g", {

        transform: "translate(180 130)"

      }, scene);

      sun(sunGroup, 17);

      el("path", {

        d:

          "M 111 177 Q 123 163 139 176 " +

          "Q 153 169 162 181",

        fill: "none",

        stroke: "#d9e7f4",

        "stroke-width": 5,

        "stroke-linecap": "round",

        opacity: ".6"

      }, scene);

      return;

    }

    // その他の昼は空の色が変化

    el("circle", {

      cx: 180,

      cy: 180,

      r: 95,

      fill: "url(#day" + stage + ")"

    }, scene);

    // 地平線

    el("path", {

      d:

        "M 100 207 Q 138 195 180 206 " +

        "Q 220 196 260 207 " +

        "L 260 226 L 100 226 Z",

      fill:

        stage <= 2 || stage >= 8

          ? "#1c2947"

          : "#315a77"

    }, scene);

    // 朝から夕方まで太陽が移動

    const xs = [

      115, 131, 146, 163, 180,

      197, 214, 229, 245

    ];

    const ys = [

      220, 203, 179, 151, 130,

      151, 179, 203, 220

    ];

    const x = xs[index];

    const y = ys[index];

    const radius =

      (stage === 1 || stage === 9) ? 11 : 16;

    const sunGroup = el("g", {

      transform:

        "translate(" + x + " " + y + ")"

    }, scene);

    sun(sunGroup, radius);

    // 朝夕の光

    if (stage <= 3 || stage >= 7) {

      el("ellipse", {

        cx: 180,

        cy: 204,

        rx: 70,

        ry: 12,

        fill: "#ffbb74",

        opacity:

          stage === 2 || stage === 8

            ? ".3"

            : ".15"

      }, scene);

    }

    // 雲

    if (

      stage === 2 ||

      stage === 3 ||

      stage === 4

    ) {

      cloud(147, 171, .5);

      cloud(219, 187, .35);

    }

    if (

      stage === 6 ||

      stage === 7 ||

      stage === 8

    ) {

      cloud(136, 178, .45);

      cloud(221, 168, .3);

    }

    // 夜明け・日没の星

    if (stage === 1 || stage === 9) {

      [

        [140, 117],

        [211, 131],

        [231, 159]

      ].forEach(function (p) {

        el("circle", {

          cx: p[0],

          cy: p[1],

          r: 1.3,

          fill: "#fff5d6",

          opacity: ".7"

        }, scene);

      });

    }

  }

  // 表示更新

  function render() {

    hp.forEach(function (value, index) {

      document.getElementById(

        "hp" + index

      ).textContent = value;

    });

    clearScene();

    if (pos < 9) {

      drawNight(pos);

      label.textContent = "夜";

      count.textContent =

        pos === 4

          ? "真夜中"

          : (pos + 1) + " / 9";

    } else {

      const dayIndex = pos - 9;

      drawDay(dayIndex);

      label.textContent = "昼";

      count.textContent =

        dayIndex === 4

          ? "正午"

          : (dayIndex + 1) + " / 9";

    }

    // 現在位置を発光

    for (let k = 0; k < 18; k++) {

      const active = k === pos;

      const halo = document.getElementById(

        "halo" + k

      );

      halo.setAttribute(

        "fill",

        active ? "#f5d98a" : "transparent"

      );

      halo.setAttribute(

        "fill-opacity",

        active ? ".3" : "0"

      );

      halo.setAttribute(

        "stroke",

        active ? "#ffe6a0" : "transparent"

      );

      halo.setAttribute(

        "stroke-width",

        active ? "2" : "0"

      );

      document.getElementById(

        "mark" + k

      ).setAttribute(

        "class",

        active ? "active" : ""

      );

    }

    saveState();

  }

  // HP増減

  document.querySelectorAll(

    "[data-hp]"

  ).forEach(function (button) {

    button.addEventListener(

      "click",

      function () {

        const index = Number(

          button.getAttribute("data-hp")

        );

        const delta = Number(

          button.getAttribute("data-delta")

        );

        hp[index] = Math.max(

          0,

          Math.min(

            100,

            hp[index] + delta

          )

        );

        render();

      }

    );

  });

  // 左へ1マス

  document.getElementById(

    "back"

  ).addEventListener(

    "click",

    function () {

      pos = (pos + 17) % 18;

      render();

    }

  );

  // 右へ1マス

  document.getElementById(

    "forward"

  ).addEventListener(

    "click",

    function () {

      pos = (pos + 1) % 18;

      render();

    }

  );

  // リセット

  document.getElementById(

    "reset"

  ).addEventListener(

    "click",

    function () {

      hp = [100, 100];

      pos = 4;

      render();

    }

  );

  render();

})();

</script>

</body>

</html>
