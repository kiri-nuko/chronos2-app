

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">

<meta name="theme-color" content="#101e49">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>クロノス管理アプリ</title>

<style>

*{box-sizing:border-box}

body{

  margin:0;

  padding:12px 12px 28px;

  background:linear-gradient(#101e49,#1b3171);

  background-attachment:fixed;

  color:#f5e9cb;

  font-family:-apple-system,BlinkMacSystemFont,sans-serif;

  text-align:center;

}

h2{

  font-size:18px;

  letter-spacing:3px;

  margin:10px 0;

}

.panel{

  background:#293b85;

  border:1px solid #8e9dcb;

  border-radius:14px;

  padding:12px;

  margin:10px auto;

  max-width:420px;

}

.hp{

  font-size:52px;

  font-weight:bold;

  color:white;

  margin:5px;

}

.controls,.move{

  display:flex;

  justify-content:center;

  align-items:center;

  gap:7px;

}

button{

  background:#465a9c;

  color:white;

  border:1px solid #aab8e0;

  border-radius:9px;

  padding:12px;

  font-size:17px;

  touch-action:manipulation;

  cursor:pointer;

  -webkit-tap-highlight-color:transparent;

}

.controls button{

  flex:1;

  padding:12px 4px;

}

button:active{background:#8094d1}

svg{

  display:block;

  width:100%;

  max-width:350px;

  margin:auto;

}

.move{

  margin:12px 0;

  gap:18px;

}

.move button{min-width:120px}

.small{

  font-size:12px;

  color:#d4def5;

}

.active{

  filter:drop-shadow(0 0 5px #ffe5a0)

         drop-shadow(0 0 10px #ffd36a);

}

.reset{

  margin:12px 0 20px;

  padding:12px 25px;

}

</style>

</head>

<body>

<h2>クロノス管理</h2>

<div class="panel">

  <div>プレイヤー1</div>

  <div class="hp" id="hp0">100</div>

  <div class="controls">

    <button data-hp="0" data-delta="-20">−20</button>

    <button data-hp="0" data-delta="-10">−10</button>

    <button data-hp="0" data-delta="10">＋10</button>

    <button data-hp="0" data-delta="20">＋20</button>

  </div>

</div>

<div class="small">現在のクロノス</div>

<svg id="clock" viewBox="0 0 360 360"></svg>

<div class="move">

  <button id="back">◀ 戻る</button>

  <button id="forward">進む ▶</button>

</div>

<div class="panel">

  <div>プレイヤー2</div>

  <div class="hp" id="hp1">100</div>

  <div class="controls">

    <button data-hp="1" data-delta="-20">−20</button>

    <button data-hp="1" data-delta="-10">−10</button>

    <button data-hp="1" data-delta="10">＋10</button>

    <button data-hp="1" data-delta="20">＋20</button>

  </div>

</div>

<button class="reset" id="reset">

すべてリセット

</button>

<script>

(function(){

"use strict";

let hp=[100,100];

// 初期位置：夜5（真夜中）

let pos=4;

// 保存済みの状態を読み込む

try{

  const saved=JSON.parse(

    localStorage.getItem("chronos-state-v1")

  );

  if(saved){

    if(Array.isArray(saved.hp)&&saved.hp.length===2){

      hp=saved.hp.map(function(v){

        const n=Number(v);

        return Number.isFinite(n)

          ?Math.max(0,Math.min(100,n))

          :100;

      });

    }

    if(Number.isInteger(saved.pos)&&

       saved.pos>=0&&saved.pos<18){

      pos=saved.pos;

    }

  }

}catch(e){}

function saveState(){

  try{

    localStorage.setItem(

      "chronos-state-v1",

      JSON.stringify({hp:hp,pos:pos})

    );

  }catch(e){}

}

const ns="http://www.w3.org/2000/svg";

const svg=document.getElementById("clock");

function el(tag,attrs,parent=svg){

  const e=document.createElementNS(ns,tag);

  for(const k in attrs){

    e.setAttribute(k,attrs[k]);

  }

  parent.appendChild(e);

  return e;

}

// グラデーション

const defs=el("defs",{});

function gradient(id,colors){

  const g=el("linearGradient",{

    id:id,x1:"0%",y1:"0%",x2:"0%",y2:"100%"

  },defs);

  colors.forEach(function(c,i){

    el("stop",{

      offset:(i/(colors.length-1)*100)+"%",

      "stop-color":c

    },g);

  });

}

// 昼1〜9の空

gradient("day1",["#07132d","#283b65","#e07b55"]);

gradient("day2",["#263d73","#d66b66","#ffc16b"]);

gradient("day3",["#468cc3","#8fc7dc","#ffe0a1"]);

gradient("day4",["#2b8bd0","#80c7eb","#d5eefa"]);

gradient("day6",["#398bc9","#7dbbdf","#d7e9f4"]);

gradient("day7",["#456ca1","#eaa064","#f8c06e"]);

gradient("day8",["#493b70","#cc5a65","#ff9b52"]);

gradient("day9",["#101e43","#42385d","#ad5265"]);

// 月と太陽の色

const moonGradient=el("radialGradient",{

  id:"moonGlow"

},defs);

el("stop",{

  offset:"0%","stop-color":"#fff6c8"

},moonGradient);

el("stop",{

  offset:"70%","stop-color":"#f2d99a"

},moonGradient);

el("stop",{

  offset:"100%","stop-color":"#d7b66f"

},moonGradient);

const sunGradient=el("radialGradient",{

  id:"sunGlow"

},defs);

el("stop",{

  offset:"0%","stop-color":"#fff7bf"

},sunGradient);

el("stop",{

  offset:"65%","stop-color":"#ffda69"

},sunGradient);

el("stop",{

  offset:"100%","stop-color":"#ff9c36"

},sunGradient);

// クロノス外周

el("circle",{

  cx:180,cy:180,r:176,

  fill:"#172755",

  stroke:"#9badd7",

  "stroke-width":1.5

});

// 昼夜の境界

el("line",{

  x1:7,y1:180,x2:353,y2:180,

  stroke:"#7286ba",

  "stroke-opacity":".45"

});

// 月の満ち欠け

function moonPhase(parent,index,r){

  const illuminated=

    (1-Math.cos(2*Math.PI*index/8))/2;

  el("circle",{

    r:r,

    fill:"#0c1734",

    stroke:"#b3c1d9",

    "stroke-opacity":".45",

    "stroke-width":".7"

  },parent);

  if(illuminated<.01)return;

  if(illuminated>.99){

    el("circle",{

      r:r,

      fill:"url(#moonGlow)"

    },parent);

    return;

  }

  const waxing=index<4;

  const rx=Math.abs(1-2*illuminated)*r;

  const sweepOuter=waxing?1:0;

  const sweepInner=illuminated<.5

    ?(waxing?0:1)

    :(waxing?1:0);

  const d=

    "M 0 "+(-r)+

    " A "+r+" "+r+" 0 0 "+sweepOuter+

    " 0 "+r+

    " A "+rx+" "+r+" 0 0 "+sweepInner+

    " 0 "+(-r)+" Z";

  el("path",{

    d:d,

    fill:"url(#moonGlow)"

  },parent);

}

// 従来の太陽（昼5/9）

function sun(parent,r){

  for(let j=0;j<8;j++){

    const a=j*Math.PI/4;

    el("line",{

      x1:(r+3)*Math.sin(a),

      y1:-(r+3)*Math.cos(a),

      x2:(r+10)*Math.sin(a),

      y2:-(r+10)*Math.cos(a),

      stroke:"#ffd56c",

      "stroke-width":2.5,

      "stroke-linecap":"round"

    },parent);

  }

  el("circle",{

    r:r,

    fill:"url(#sunGlow)"

  },parent);

}

// 昼の外周太陽マーク

function drawSunStage(parent,stage){

  // 昼5/9は従来の太陽

  if(stage===5){

    sun(parent,9);

    return;

  }

  const distance=Math.abs(stage-5);

  const radius=9-distance;

  const sunY=distance*2.8;

  const group=el("g",{

    transform:"translate(0 "+sunY+")"

  },parent);

  const rays=(stage===1||stage===9)?4:8;

  const rayLength=(stage===2||stage===8)?5:8;

  for(let j=0;j<rays;j++){

    const a=j/rays*Math.PI*2;

    el("line",{

      x1:(radius+3)*Math.sin(a),

      y1:-(radius+3)*Math.cos(a),

      x2:(radius+rayLength)*Math.sin(a),

      y2:-(radius+rayLength)*Math.cos(a),

      stroke:(stage<=3||stage>=7)

        ?"#ffab60":"#ffda76",

      "stroke-width":2,

      "stroke-linecap":"round"

    },group);

  }

  el("circle",{

    r:radius,

    fill:(stage<=3||stage>=7)

      ?"#ffad62":"#ffe18b"

  },group);

  // 日の出・日没の地平線

  if(stage===1||stage===2||stage===8||stage===9){

    const horizonY=(stage===1||stage===9)?0:6;

    el("rect",{

      x:-23,y:horizonY,

      width:46,height:24,

      fill:"#172755"

    },group);

    el("line",{

      x1:-20,y1:horizonY,

      x2:20,y2:horizonY,

      stroke:"#ffb978",

      "stroke-width":1.5

    },group);

  }

}

// クロノス18マス

for(let k=0;k<18;k++){

  const a=(-80+k*20)*Math.PI/180;

  const x=180+145*Math.sin(a);

  const y=180-145*Math.cos(a);

  const g=el("g",{

    transform:"translate("+x+" "+y+")",

    id:"mark"+k

  });

  el("circle",{

    r:24,

    fill:"transparent",

    stroke:"transparent",

    id:"halo"+k

  },g);

  if(k<9){

    // 夜：月の満ち欠け

    moonPhase(g,k,13);

  }else{

    // 昼：太陽の昇降

    drawSunStage(g,k-8);

  }

  // タップ領域

  el("circle",{

    r:23,

    fill:"transparent",

    style:"pointer-events:all"

  },g);

  g.addEventListener("click",function(){

    pos=k;

    render();

  });

}

// 中央の円

el("circle",{

  cx:180,cy:180,r:102,

  fill:"#101e46",

  stroke:"#91a4cf",

  "stroke-width":1.5

});

const scene=el("g",{id:"scene"});

const label=el("text",{

  x:180,y:229,

  "text-anchor":"middle",

  fill:"#f0e6d1",

  "font-size":18

});

const count=el("text",{

  x:180,y:257,

  "text-anchor":"middle",

  fill:"#ffffff",

  "font-size":23

});

function clearScene(){

  while(scene.firstChild){

    scene.removeChild(scene.firstChild);

  }

}

// 夜の中央表示

function drawNight(index){

  el("circle",{

    cx:180,cy:180,r:95,

    fill:"#101e46"

  },scene);

  const stars=[

    [119,137],[145,110],[211,111],

    [244,143],[123,187],[237,188],

    [162,126],[198,153]

  ];

  stars.forEach(function(p){

    el("circle",{

      cx:p[0],cy:p[1],r:1.3,

      fill:"#e8efff",

      opacity:".8"

    },scene);

  });

  const mg=el("g",{

    transform:"translate(180 166)"

  },scene);

  moonPhase(mg,index,39);

}

// 雲

function cloud(x,y,opacity){

  el("path",{

    d:

      "M "+(x-24)+" "+y+

      " Q "+(x-14)+" "+(y-12)+

      " "+x+" "+(y-5)+

      " Q "+(x+12)+" "+(y-17)+

      " "+(x+24)+" "+y,

    fill:"none",

    stroke:"#ffffff",

    "stroke-width":5,

    "stroke-linecap":"round",

    opacity:opacity

  },scene);

}

// 昼の中央表示

function drawDay(index){

  const n=index+1;

  // 昼5/9は従来のUIを維持

  if(n===5){

    el("circle",{

      cx:180,cy:180,r:95,

      fill:"#448fca"

    },scene);

    el("path",{

      d:"M 100 202 Q 145 190 180 201 "+

        "Q 219 191 260 203 "+

        "L 260 219 L 100 219 Z",

      fill:"#26476d"

    },scene);

    const sg=el("g",{

      transform:"translate(180 130)"

    },scene);

    sun(sg,17);

    el("path",{

      d:"M 111 177 Q 123 163 139 176 "+

        "Q 153 169 162 181",

      fill:"none",

      stroke:"#d9e7f4",

      "stroke-width":5,

      "stroke-linecap":"round",

      opacity:".6"

    },scene);

    return;

  }

  // その他の昼は空の色が変化

  el("circle",{

    cx:180,cy:180,r:95,

    fill:"url(#day"+n+")"

  },scene);

  // 地平線

  el("path",{

    d:"M 100 207 Q 138 195 180 206 "+

      "Q 220 196 260 207 "+

      "L 260 226 L 100 226 Z",

    fill:n<=2||n>=8?"#1c2947":"#315a77"

  },scene);

  // 太陽の位置

  const xs=[115,131,146,163,180,197,214,229,245];

  const ys=[220,203,179,151,130,151,179,203,220];

  const x=xs[index];

  const y=ys[index];

  const radius=(n===1||n===9)?11:16;

  const sg=el("g",{

    transform:"translate("+x+" "+y+")"

  },scene);

  sun(sg,radius);

  // 朝夕の光

  if(n<=3||n>=7){

    el("ellipse",{

      cx:180,cy:204,

      rx:70,ry:12,

      fill:"#ffbb74",

      opacity:n===2||n===8?".3":".15"

    },scene);

  }

  // 雲

  if(n===2||n===3||n===4){

    cloud(147,171,.5);

    cloud(219,187,.35);

  }

  if(n===6||n===7||n===8){

    cloud(136,178,.45);

    cloud(221,168,.3);

  }

  // 薄暗い空の星

  if(n===1||n===9){

    [[140,117],[211,131],[231,159]].forEach(function(p){

      el("circle",{

        cx:p[0],cy:p[1],r:1.3,

        fill:"#fff5d6",

        opacity:".7"

      },scene);

    });

  }

}

// 表示更新

function render(){

  hp.forEach(function(v,i){

    document.getElementById("hp"+i).textContent=v;

  });

  clearScene();

  if(pos<9){

    drawNight(pos);

    label.textContent="夜";

    count.textContent=pos===4

      ?"真夜中"

      :(pos+1)+" / 9";

  }else{

    const dayIndex=pos-9;

    drawDay(dayIndex);

    label.textContent="昼";

    count.textContent=(dayIndex+1)+" / 9";

  }

  // 現在位置の発光

  for(let k=0;k<18;k++){

    const active=k===pos;

    const halo=document.getElementById("halo"+k);

    halo.setAttribute(

      "fill",active?"#f5d98a":"transparent"

    );

    halo.setAttribute(

      "fill-opacity",active?".3":"0"

    );

    halo.setAttribute(

      "stroke",active?"#ffe6a0":"transparent"

    );

    halo.setAttribute(

      "stroke-width",active?"2":"0"

    );

    document.getElementById("mark"+k)

      .setAttribute("class",active?"active":"");

  }

  saveState();

}

// HP操作

document.querySelectorAll("[data-hp]").forEach(function(button){

  button.addEventListener("click",function(){

    const i=Number(button.getAttribute("data-hp"));

    const d=Number(button.getAttribute("data-delta"));

    hp[i]=Math.max(0,Math.min(100,hp[i]+d));

    render();

  });

});

// 1マス戻る

document.getElementById("back").addEventListener("click",function(){

  pos=(pos+17)%18;

  render();

});

// 1マス進む

document.getElementById("forward").addEventListener("click",function(){

  pos=(pos+1)%18;

  render();

});

// すべてリセット

document.getElementById("reset").addEventListener("click",function(){

  hp=[100,100];

  pos=4;

  render();

});

render();

})();

</script>

</body>

</html>
