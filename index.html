

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no">

<meta name="theme-color" content="#111d49">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<title>クロノス管理</title>

<style>

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

}

html, body {

  width: 100%;

  height: 100%;

  margin: 0;

  overflow: hidden;

  background: #111d49;

  color: #fff;

  font-family: -apple-system, BlinkMacSystemFont,

    "Hiragino Kaku Gothic ProN", sans-serif;

}

button {

  font: inherit;

  color: inherit;

  touch-action: manipulation;

  cursor: pointer;

}

#viewport {

  position: fixed;

  inset: 0;

  overflow: hidden;

}

#app {

  position: absolute;

  top: 0;

  left: 0;

  width: 390px;

  padding: 0 10px;

  transform-origin: top left;

  background: linear-gradient(

    180deg,

    #111d49 0%,

    #202f69 100%

  );

}

h1 {

  font-size: 17px;

  letter-spacing: 3px;

  text-align: center;

  font-weight: 600;

  margin: 8px 0 9px;

}

.player {

  background: #2e4087;

  border: 1px solid #8b9dd0;

  border-radius: 13px;

  padding: 9px;

  text-align: center;

}

.player.one {

  transform: rotate(180deg);

}

.player-name {

  font-size: 15px;

  color: #f4e9d3;

}

.hp {

  font-size: 43px;

  line-height: 1.05;

  font-weight: 750;

  margin: 6px 0 9px;

  font-variant-numeric: tabular-nums;

}

.hp-buttons {

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 6px;

}

.hp-buttons button,

.move-buttons button,

#reset {

  background: #4b62a4;

  border: 1px solid #a0afd8;

  border-radius: 9px;

}

.hp-buttons button {

  min-width: 0;

  height: 41px;

  font-size: 17px;

  white-space: nowrap;

  padding: 0 2px;

}

button:active {

  filter: brightness(1.3);

}

.section-label {

  text-align: center;

  font-size: 12px;

  color: #e0e7fb;

  margin: 7px 0 2px;

}

#clock {

  display: block;

  width: 100%;

  height: auto;

  aspect-ratio: 1 / 1;

  overflow: visible;

  touch-action: manipulation;

}

.move-buttons {

  display: grid;

  grid-template-columns: 1fr 1fr;

  gap: 12px;

  margin: 5px 38px 7px;

}

.move-buttons button {

  height: 45px;

  font-size: 16px;

  white-space: nowrap;

}

.reset-wrap {

  text-align: center;

  margin-top: 7px;

}

#reset {

  height: 38px;

  min-width: 145px;

  font-size: 14px;

  padding: 0 15px;

}

svg text {

  user-select: none;

  pointer-events: none;

}

.clock-mark {

  cursor: pointer;

}

</style>

</head>

<body>

<div id="viewport">

  <main id="app">

    <h1>クロノス管理</h1>

    <section class="player one">

      <div class="player-name">プレイヤー1</div>

      <div class="hp" id="hp1">100</div>

      <div class="hp-buttons">

        <button data-player="0" data-delta="-20">−20</button>

        <button data-player="0" data-delta="-10">−10</button>

        <button data-player="0" data-delta="10">＋10</button>

        <button data-player="0" data-delta="20">＋20</button>

      </div>

    </section>

    <div class="section-label">現在のクロノス</div>

    <svg id="clock"

      viewBox="0 0 360 360"

      xmlns="http://www.w3.org/2000/svg"

      aria-label="クロノス盤">

    </svg>

    <div class="move-buttons">

      <button id="back">◀ 戻る</button>

      <button id="forward">進む ▶</button>

    </div>

    <section class="player">

      <div class="player-name">プレイヤー2</div>

      <div class="hp" id="hp2">100</div>

      <div class="hp-buttons">

        <button data-player="1" data-delta="-20">−20</button>

        <button data-player="1" data-delta="-10">−10</button>

        <button data-player="1" data-delta="10">＋10</button>

        <button data-player="1" data-delta="20">＋20</button>

      </div>

    </section>

    <div class="reset-wrap">

      <button id="reset">すべてリセット</button>

    </div>

  </main>

</div>

<script>

"use strict";

/* ===== ゲーム状態 ===== */

let hp = [100, 100];

// 夜5/9から開始

let position = 4;

const svg = document.getElementById("clock");

const NS = "http://www.w3.org/2000/svg";

const C = {

  background: "#111d49",

  line: "#9baad3",

  gold: "#f4d78e",

  goldLight: "#fff0b4",

  orange: "#ffb166",

  night: "#0b1534"

};

function createSVG(tag, attrs = {}, parent = svg) {

  const el = document.createElementNS(NS, tag);

  for (const [key, value] of Object.entries(attrs)) {

    el.setAttribute(key, value);

  }

  parent.appendChild(el);

  return el;

}

/* ===== クロノス盤 ===== */

const defs = createSVG("defs");

const moonGradient = createSVG("radialGradient", {

  id: "moonGradient",

  cx: "35%",

  cy: "30%",

  r: "75%"

}, defs);

createSVG("stop", {

  offset: "0%",

  "stop-color": "#fff6cb"

}, moonGradient);

createSVG("stop", {

  offset: "70%",

  "stop-color": "#f0d48b"

}, moonGradient);

createSVG("stop", {

  offset: "100%",

  "stop-color": "#ba873c"

}, moonGradient);

const sunGradient = createSVG("radialGradient", {

  id: "sunGradient"

}, defs);

createSVG("stop", {

  offset: "0%",

  "stop-color": "#fff2ad"

}, sunGradient);

createSVG("stop", {

  offset: "100%",

  "stop-color": "#ffc05e"

}, sunGradient);

createSVG("circle", {

  cx: 180,

  cy: 180,

  r: 173,

  fill: "none",

  stroke: C.line,

  "stroke-width": 1.3

});

createSVG("path", {

  d: "M 7 180 H 353",

  stroke: C.line,

  "stroke-width": 0.8,

  opacity: 0.5

});

createSVG("circle", {

  cx: 180,

  cy: 180,

  r: 102,

  fill: C.background,

  stroke: C.line,

  "stroke-width": 1.3

});

/* ===== 星 ===== */

[

  [145, 116],

  [172, 131],

  [209, 117],

  [121, 144],

  [239, 144],

  [125, 210],

  [232, 210]

].forEach(([x, y]) => {

  createSVG("circle", {

    cx: x,

    cy: y,

    r: 1.1,

    fill: "#d7dcf3"

  });

});

/* ===== 夜の月 ===== */

function drawMoon(group, index) {

  const radius = 12.5;

  // 夜1～4：満ちていく月

  // 夜5：満月

  // 夜6～9：欠けていく月

  createSVG("circle", {

    r: radius,

    fill: C.night,

    stroke: "#66749a",

    "stroke-width": 0.6

  }, group);

  if (index === 8) {

    // 夜9：新月

    return;

  }

  if (index === 4) {

    createSVG("circle", {

      r: radius,

      fill: "url(#moonGradient)"

    }, group);

    return;

  }

  const phase = index / 8;

  const illumination =

    (1 - Math.cos(2 * Math.PI * phase)) / 2;

  // 月の明るい部分を楕円弧で表現

  const terminator = Math.abs(1 - 2 * illumination) * radius;

  const waxing = index < 4;

  let d;

  if (waxing) {

    // 右側が明るい

    d = [

      `M 0 ${-radius}`,

      `A ${radius} ${radius} 0 0 1 0 ${radius}`,

      `A ${Math.max(0.01, terminator)} ${radius} 0 0 ${illumination < 0.5 ? 0 : 1} 0 ${-radius}`,

      "Z"

    ].join(" ");

  } else {

    // 左側が明るい

    d = [

      `M 0 ${-radius}`,

      `A ${radius} ${radius} 0 0 0 0 ${radius}`,

      `A ${Math.max(0.01, terminator)} ${radius} 0 0 ${illumination < 0.5 ? 1 : 0} 0 ${-radius}`,

      "Z"

    ].join(" ");

  }

  createSVG("path", {

    d,

    fill: "url(#moonGradient)"

  }, group);

}

/* ===== 昼の太陽 ===== */

function drawSun(group, dayIndex) {

  // dayIndex: 0～8

  // 0:日の出、4:正午、8:日没

  const distanceFromNoon = Math.abs(dayIndex - 4);

  const heightRatio = 1 - distanceFromNoon / 4;

  const color =

    distanceFromNoon >= 3

      ? C.orange

      : C.gold;

  // 地平線

  if (dayIndex !== 4) {

    createSVG("line", {

      x1: -18,

      y1: 11,

      x2: 18,

      y2: 11,

      stroke: color,

      "stroke-width": 1.7

    }, group);

  }

  const radius = 5 + heightRatio * 4;

  // 太陽の高さを変える

  const sunY = 10 - heightRatio * 10;

  const sunGroup = createSVG("g", {

    transform: `translate(0 ${sunY})`

  }, group);

  // 太陽本体

  createSVG("circle", {

    r: radius,

    fill: dayIndex === 4

      ? "url(#sunGradient)"

      : color

  }, sunGroup);

  // 光線

  const rayCount = 8;

  for (let j = 0; j < rayCount; j++) {

    const a = j * Math.PI * 2 / rayCount;

    const inner = radius + 3;

    const outer = radius + 7;

    const x1 = Math.cos(a) * inner;

    const y1 = Math.sin(a) * inner;

    const x2 = Math.cos(a) * outer;

    const y2 = Math.sin(a) * outer;

    // 日の出・日没付近では下側の光線を隠す

    if (distanceFromNoon >= 3 && y2 > 0) {

      continue;

    }

    createSVG("line", {

      x1, y1, x2, y2,

      stroke: color,

      "stroke-width": 1.8,

      "stroke-linecap": "round"

    }, sunGroup);

  }

}

/* ===== 18マス配置 ===== */

const marks = [];

for (let i = 0; i < 18; i++) {

  // 上半円に夜9マス

  // 下半円に昼9マス

  const angle = (-80 + i * 20) * Math.PI / 180;

  const x = 180 + 146 * Math.sin(angle);

  const y = 180 - 146 * Math.cos(angle);

  const group = createSVG("g", {

    transform: `translate(${x} ${y})`,

    class: "clock-mark"

  });

  const halo = createSVG("circle", {

    r: 23,

    fill: "none",

    stroke: "none",

    "stroke-width": 2.5

  }, group);

  marks.push(halo);

  if (i < 9) {

    drawMoon(group, i);

  } else {

    drawSun(group, i - 9);

  }

  createSVG("circle", {

    r: 23,

    fill: "transparent"

  }, group);

  group.addEventListener("click", () => {

    position = i;

    render();

  });

}

/* ===== 中央表示 ===== */

const centerObject = createSVG("g");

const centerSymbol = createSVG("g", {}, centerObject);

const phaseLabel = createSVG("text", {

  x: 180,

  y: 236,

  fill: "#f2e6d1",

  "font-size": 17,

  "text-anchor": "middle"

}, centerObject);

const phaseNumber = createSVG("text", {

  x: 180,

  y: 265,

  fill: "#ffffff",

  "font-size": 23,

  "text-anchor": "middle"

}, centerObject);

function drawCenterSymbol() {

  centerSymbol.replaceChildren();

  const isNight = position < 9;

  const number = isNight ? position : position - 9;

  const g = createSVG("g", {

    transform: "translate(180 174) scale(2.25)"

  }, centerSymbol);

  if (isNight) {

    drawMoon(g, number);

  } else {

    drawSun(g, number);

  }

}

/* ===== 表示更新 ===== */

function render() {

  document.getElementById("hp1").textContent = hp[0];

  document.getElementById("hp2").textContent = hp[1];

  marks.forEach((halo, i) => {

    if (i === position) {

      halo.setAttribute("stroke", C.gold);

      halo.setAttribute("fill", "#f4d78e18");

    } else {

      halo.setAttribute("stroke", "none");

      halo.setAttribute("fill", "none");

    }

  });

  const isNight = position < 9;

  const number = isNight

    ? position + 1

    : position - 8;

  phaseLabel.textContent = isNight ? "夜" : "昼";

  if (number === 5) {

    phaseNumber.textContent =

      isNight ? "真夜中" : "正午";

  } else {

    phaseNumber.textContent = `${number} / 9`;

  }

  drawCenterSymbol();

}

/* ===== HP操作 ===== */

document.querySelectorAll("[data-player]").forEach(button => {

  button.addEventListener("click", () => {

    const player = Number(button.dataset.player);

    const delta = Number(button.dataset.delta);

    hp[player] = Math.max(

      0,

      Math.min(100, hp[player] + delta)

    );

    render();

  });

});

/* ===== クロノス移動 ===== */

document.getElementById("back").addEventListener("click", () => {

  position = (position + 17) % 18;

  render();

});

document.getElementById("forward").addEventListener("click", () => {

  position = (position + 1) % 18;

  render();

});

/* ===== リセット ===== */

document.getElementById("reset").addEventListener("click", () => {

  hp = [100, 100];

  position = 4;

  render();

});

/* ===== 画面サイズ自動調整 ===== */

function fitScreen() {

  const app = document.getElementById("app");

  // 一度縮小を解除して元の寸法を計測

  app.style.transform = "none";

  const baseWidth = 390;

  const contentHeight = app.scrollHeight;

  // Safariの実際の表示可能領域

  const visibleWidth = document.documentElement.clientWidth;

  const visibleHeight = window.visualViewport

    ? window.visualViewport.height

    : window.innerHeight;

  // ホーム画面追加時とSafari表示時の両方に対応

  const topSafe = parseFloat(

    getComputedStyle(document.documentElement)

      .getPropertyValue("--top-safe")

  ) || 0;

  const bottomSafe = parseFloat(

    getComputedStyle(document.documentElement)

      .getPropertyValue("--bottom-safe")

  ) || 0;

  const availableHeight =

    visibleHeight - topSafe - bottomSafe - 8;

  const widthScale = visibleWidth / baseWidth;

  const heightScale = availableHeight / contentHeight;

  // 画面からはみ出さない最大倍率

  const scale = Math.min(widthScale, heightScale);

  app.style.transform = `scale(${scale})`;

  const scaledWidth = baseWidth * scale;

  const scaledHeight = contentHeight * scale;

  // 横中央、縦中央に配置

  app.style.left =

    `${Math.max(0, (visibleWidth - scaledWidth) / 2)}px`;

  app.style.top =

    `${Math.max(0, (visibleHeight - scaledHeight) / 2)}px`;

}

let resizeFrame;

function scheduleFit() {

  cancelAnimationFrame(resizeFrame);

  resizeFrame = requestAnimationFrame(fitScreen);

}

window.addEventListener("resize", scheduleFit);

if (window.visualViewport) {

  window.visualViewport.addEventListener(

    "resize",

    scheduleFit

  );

}

window.addEventListener(

  "orientationchange",

  scheduleFit

);

render();

scheduleFit();

</script>

</body>

</html>
