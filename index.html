

<!DOCTYPE html>

<html lang="ja">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<meta name="theme-color" content="#111d49">

<meta name="apple-mobile-web-app-capable" content="yes">

<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<meta name="apple-mobile-web-app-title" content="クロノス管理">

<title>クロノス管理</title>

<style>

* {

  box-sizing: border-box;

  -webkit-tap-highlight-color: transparent;

}

:root {

  --edge: 7px;

  --gap: 5px;

  --clock-size: 350px;

  --hp-size: 38px;

  --hp-button-height: 35px;

  --move-height: 42px;

  --panel-padding: 6px;

  --reset-size: 54px;

  --flip-size: 36px;

}

html, body {

  margin: 0;

  width: 100%;

  height: 100%;

  overflow: hidden;

  background: #111d49;

}

body {

  color: white;

  font-family:

    -apple-system,

    BlinkMacSystemFont,

    "Hiragino Kaku Gothic ProN",

    sans-serif;

  -webkit-text-size-adjust: 100%;

}

button {

  appearance: none;

  -webkit-appearance: none;

  font: inherit;

  color: white;

  cursor: pointer;

  touch-action: manipulation;

  user-select: none;

  -webkit-user-select: none;

}

button:active {

  filter: brightness(1.3);

}

#viewport {

  position: fixed;

  inset: 0;

  overflow: hidden;

  background: linear-gradient(

    180deg,

    #111d49,

    #202f69

  );

}

#app {

  position: absolute;

  left: 0;

  top: 0;

  width: 100%;

  padding: 0 var(--edge);

  display: flex;

  flex-direction: column;

  align-items: stretch;

  gap: var(--gap);

}

/* タイトル */

h1 {

  margin: 0;

  text-align: center;

  color: #f3e9d3;

  font-size: 18px;

  line-height: 1.25;

  font-weight: 650;

  letter-spacing: 3px;

  flex-shrink: 0;

}

/* HP管理パネル */

.player {

  width: 100%;

  background: #2e4087;

  border: 1px solid #91a2d0;

  border-radius: 12px;

  padding: var(--panel-padding);

  text-align: center;

  flex-shrink: 0;

}

.player.one {

  transform: rotate(180deg);

}

.player-name {

  color: #f3e9d3;

  font-size: 14px;

  line-height: 1.15;

}

.hp {

  font-size: var(--hp-size);

  line-height: 1;

  font-weight: 750;

  margin: 2px 0 5px;

  font-variant-numeric: tabular-nums;

}

.hp-buttons {

  display: grid;

  grid-template-columns: repeat(4, minmax(0, 1fr));

  gap: 5px;

}

.hp-buttons button {

  min-width: 0;

  width: 100%;

  height: var(--hp-button-height);

  padding: 0 2px;

  border: 1px solid #a3b2db;

  border-radius: 8px;

  background: #4b62a4;

  font-size: 16px;

  line-height: 1;

  white-space: nowrap;

}

/* プレイヤー1 */

.player-one-area {

  position: relative;

  width: 100%;

  flex-shrink: 0;

}

/* HPパネル枠外の左下に反転ボタン */

.flip-row {

  position: absolute;

  left: 0;

  top: calc(100% + 3px);

  z-index: 10;

}

#flip {

  width: var(--flip-size);

  height: var(--flip-size);

  padding: 0;

  border: 1px solid #a3b2db;

  border-radius: 50%;

  background: #4b62a4;

  font-size: 10px;

  font-weight: 650;

  display: flex;

  align-items: center;

  justify-content: center;

}

/* クロノス盤 */

.clock-area {

  display: flex;

  flex-direction: column;

  align-items: center;

  justify-content: center;

  gap: 2px;

  flex-shrink: 0;

}

.clock-label {

  color: #e0e7fb;

  font-size: 12px;

  line-height: 1.15;

}

#clock {

  display: block;

  width: var(--clock-size);

  height: var(--clock-size);

  max-width: 100%;

  overflow: visible;

  touch-action: manipulation;

  transform: rotate(0deg);

  transform-origin: center center;

  transition: transform 0.55s ease-in-out;

}

#clock.flipped {

  transform: rotate(180deg);

}

svg text {

  pointer-events: none;

  user-select: none;

}

.clock-mark {

  cursor: pointer;

}

/* 操作ボタン */

.controls {

  position: relative;

  width: 100%;

  height: var(--reset-size);

  display: flex;

  align-items: center;

  justify-content: center;

  flex-shrink: 0;

}

/* すべてリセット */

#reset {

  position: absolute;

  left: 0;

  top: 50%;

  transform: translateY(-50%);

  width: var(--reset-size);

  height: var(--reset-size);

  padding: 0;

  border: 1px solid #a3b2db;

  border-radius: 50%;

  background: #4b62a4;

  display: flex;

  align-items: center;

  justify-content: center;

  flex-direction: column;

  gap: 1px;

  font-size: 10px;

  line-height: 1.15;

  font-weight: 600;

  white-space: nowrap;

}

/* 戻る・進む */

.move-buttons {

  display: grid;

  grid-template-columns: repeat(2, minmax(0, 1fr));

  gap: 10px;

  width: 66%;

  margin: 0 auto;

}

.move-button {

  min-width: 0;

  width: 100%;

  height: var(--move-height);

  border: 1px solid #a3b2db;

  border-radius: 9px;

  background: #4b62a4;

  font-size: 16px;

  white-space: nowrap;

}

@media (max-width: 360px) {

  :root {

    --edge: 5px;

  }

  .hp-buttons {

    gap: 3px;

  }

  .hp-buttons button {

    font-size: 14px;

  }

  .move-buttons {

    gap: 6px;

  }

  .move-button {

    font-size: 14px;

  }

}

@media (prefers-reduced-motion: reduce) {

  #clock {

    transition: none;

  }

}

</style>

</head>

<body>

<div id="viewport">

<main id="app">

  <h1>クロノス管理</h1>

  <!-- プレイヤー1 -->

  <div class="player-one-area">

    <section class="player one">

      <div class="player-name">

        プレイヤー1

      </div>

      <div class="hp" id="hp1">100</div>

      <div class="hp-buttons">

        <button type="button" data-player="0" data-delta="-20">−20</button>

        <button type="button" data-player="0" data-delta="-10">−10</button>

        <button type="button" data-player="0" data-delta="10">＋10</button>

        <button type="button" data-player="0" data-delta="20">＋20</button>

      </div>

    </section>

    <!-- パネルの枠外に配置 -->

    <div class="flip-row">

      <button

        type="button"

        id="flip"

        aria-label="クロノス盤を反転"

        aria-pressed="false">

        反転

      </button>

    </div>

  </div>

  <!-- クロノス盤 -->

  <section class="clock-area">

    <div class="clock-label">

      現在のクロノス

    </div>

    <svg

      id="clock"

      viewBox="0 0 360 360"

      xmlns="http://www.w3.org/2000/svg"

      aria-label="クロノス盤">

    </svg>

  </section>

  <!-- 操作ボタン -->

  <section class="controls">

    <button

      type="button"

      id="reset"

      aria-label="すべてリセット">

      <span>すべて</span>

      <span>リセット</span>

    </button>

    <div class="move-buttons">

      <button

        type="button"

        class="move-button"

        id="back">

        ◀ 戻る

      </button>

      <button

        type="button"

        class="move-button"

        id="forward">

        進む ▶

      </button>

    </div>

  </section>

  <!-- プレイヤー2 -->

  <section class="player">

    <div class="player-name">

      プレイヤー2

    </div>

    <div class="hp" id="hp2">100</div>

    <div class="hp-buttons">

      <button type="button" data-player="1" data-delta="-20">−20</button>

      <button type="button" data-player="1" data-delta="-10">−10</button>

      <button type="button" data-player="1" data-delta="10">＋10</button>

      <button type="button" data-player="1" data-delta="20">＋20</button>

    </div>

  </section>

</main>

</div>

<script>

"use strict";

/* =========================

   ゲーム状態

========================= */

let hp = [100, 100];

// 夜5/9（真夜中）から開始

let position = 4;

// クロノス盤の反転状態

let isFlipped = false;

const svg = document.getElementById("clock");

const NS = "http://www.w3.org/2000/svg";

const COLORS = {

  background: "#111d49",

  line: "#9baad3",

  gold: "#f4d78e",

  orange: "#ffb166",

  night: "#0b1534"

};

/* =========================

   SVG作成

========================= */

function createSVG(tag, attrs = {}, parent = svg) {

  const el = document.createElementNS(NS, tag);

  for (const [key, value] of Object.entries(attrs)) {

    el.setAttribute(key, value);

  }

  parent.appendChild(el);

  return el;

}

/* =========================

   グラデーション

========================= */

const defs = createSVG("defs");

/* 月 */

const moonGradient = createSVG("radialGradient", {

  id: "moonGradient",

  cx: "35%",

  cy: "30%",

  r: "75%"

}, defs);

createSVG("stop", {

  offset: "0%",

  "stop-color": "#fff6cb"

}, moonGradient);

createSVG("stop", {

  offset: "70%",

  "stop-color": "#f0d48b"

}, moonGradient);

createSVG("stop", {

  offset: "100%",

  "stop-color": "#ba873c"

}, moonGradient);

/* 太陽 */

const sunGradient = createSVG("radialGradient", {

  id: "sunGradient"

}, defs);

createSVG("stop", {

  offset: "0%",

  "stop-color": "#fff2ad"

}, sunGradient);

createSVG("stop", {

  offset: "100%",

  "stop-color": "#ffc05e"

}, sunGradient);

/* 中央の空 */

const skyGradient = createSVG("linearGradient", {

  id: "skyGradient",

  x1: "0%",

  y1: "0%",

  x2: "0%",

  y2: "100%"

}, defs);

const skyTop = createSVG("stop", {

  offset: "0%",

  "stop-color": "#10214d"

}, skyGradient);

const skyBottom = createSVG("stop", {

  offset: "100%",

  "stop-color": "#253f75"

}, skyGradient);

/* =========================

   クロノスの外枠

   色は昼夜で変えない

========================= */

createSVG("circle", {

  cx: 180,

  cy: 180,

  r: 173,

  fill: "none",

  stroke: COLORS.line,

  "stroke-width": 1.3

});

createSVG("path", {

  d: "M 7 180 H 353",

  stroke: COLORS.line,

  "stroke-width": 0.8,

  opacity: 0.5

});

/* =========================

   中央の円形背景

========================= */

createSVG("circle", {

  cx: 180,

  cy: 180,

  r: 102,

  fill: "url(#skyGradient)",

  stroke: COLORS.line,

  "stroke-width": 1.3

});

/* =========================

   中央の夜空の星

========================= */

const stars = createSVG("g");

[

  [145, 116],

  [172, 131],

  [209, 117],

  [121, 144],

  [239, 144],

  [125, 210],

  [232, 210]

].forEach(([x, y]) => {

  createSVG("circle", {

    cx: x,

    cy: y,

    r: 1.1,

    fill: "#e8eeff"

  }, stars);

});

/* =========================

   中央の昼の雲

========================= */

const clouds = createSVG("g", {

  opacity: 0

});

function drawCloud(x, y, scale) {

  const group = createSVG("g", {

    transform: `translate(${x} ${y}) scale(${scale})`

  }, clouds);

  createSVG("ellipse", {

    cx: 0,

    cy: 0,

    rx: 24,

    ry: 6,

    fill: "#ffffff",

    opacity: 0.35

  }, group);

  createSVG("ellipse", {

    cx: -9,

    cy: -4,

    rx: 12,

    ry: 7,

    fill: "#ffffff",

    opacity: 0.35

  }, group);

  createSVG("ellipse", {

    cx: 8,

    cy: -5,

    rx: 15,

    ry: 8,

    fill: "#ffffff",

    opacity: 0.35

  }, group);

}

drawCloud(180, 125, 0.65);

drawCloud(140, 195, 0.5);

drawCloud(215, 195, 0.55);

/* =========================

   月の描画

========================= */

function drawMoon(group, index) {

  const radius = 12.5;

  createSVG("circle", {

    r: radius,

    fill: COLORS.night,

    stroke: "#66749a",

    "stroke-width": 0.6

  }, group);

  // 新月

  if (index === 8) {

    return;

  }

  // 満月

  if (index === 4) {

    createSVG("circle", {

      r: radius,

      fill: "url(#moonGradient)"

    }, group);

    return;

  }

  const phase = index / 8;

  const illumination =

    (1 - Math.cos(2 * Math.PI * phase)) / 2;

  const terminator =

    Math.abs(1 - 2 * illumination) * radius;

  const waxing = index < 4;

  let d;

  if (waxing) {

    d = [

      `M 0 ${-radius}`,

      `A ${radius} ${radius} 0 0 1 0 ${radius}`,

      `A ${Math.max(0.01, terminator)} ${radius} 0 0 ${illumination < 0.5 ? 0 : 1} 0 ${-radius}`,

      "Z"

    ].join(" ");

  } else {

    d = [

      `M 0 ${-radius}`,

      `A ${radius} ${radius} 0 0 0 0 ${radius}`,

      `A ${Math.max(0.01, terminator)} ${radius} 0 0 ${illumination < 0.5 ? 1 : 0} 0 ${-radius}`,

      "Z"

    ].join(" ");

  }

  createSVG("path", {

    d: d,

    fill: "url(#moonGradient)"

  }, group);

}

/* =========================

   太陽の描画

========================= */

function drawSun(group, dayIndex) {

  const distanceFromNoon = Math.abs(dayIndex - 4);

  const heightRatio = 1 - distanceFromNoon / 4;

  const color = distanceFromNoon >= 3

    ? COLORS.orange

    : COLORS.gold;

  if (dayIndex !== 4) {

    createSVG("line", {

      x1: -18,

      y1: 11,

      x2: 18,

      y2: 11,

      stroke: color,

      "stroke-width": 1.7

    }, group);

  }

  const radius = 5 + heightRatio * 4;

  const sunY = 10 - heightRatio * 10;

  const sunGroup = createSVG("g", {

    transform: `translate(0 ${sunY})`

  }, group);

  createSVG("circle", {

    r: radius,

    fill: dayIndex === 4

      ? "url(#sunGradient)"

      : color

  }, sunGroup);

  for (let j = 0; j < 8; j++) {

    const angle = j * Math.PI / 4;

    const inner = radius + 3;

    const outer = radius + 7;

    const x1 = Math.cos(angle) * inner;

    const y1 = Math.sin(angle) * inner;

    const x2 = Math.cos(angle) * outer;

    const y2 = Math.sin(angle) * outer;

    if (distanceFromNoon >= 3 && y2 > 0) {

      continue;

    }

    createSVG("line", {

      x1: x1,

      y1: y1,

      x2: x2,

      y2: y2,

      stroke: color,

      "stroke-width": 1.8,

      "stroke-linecap": "round"

    }, sunGroup);

  }

}

/* =========================

   クロノス18マス

========================= */

const marks = [];

for (let i = 0; i < 18; i++) {

  const angle = (-80 + i * 20) * Math.PI / 180;

  const x = 180 + 146 * Math.sin(angle);

  const y = 180 - 146 * Math.cos(angle);

  const group = createSVG("g", {

    transform: `translate(${x} ${y})`,

    class: "clock-mark"

  });

  const halo = createSVG("circle", {

    r: 23,

    fill: "none",

    stroke: "none",

    "stroke-width": 2.5

  }, group);

  marks.push(halo);

  if (i < 9) {

    drawMoon(group, i);

  } else {

    drawSun(group, i - 9);

  }

  createSVG("circle", {

    r: 23,

    fill: "transparent"

  }, group);

  group.addEventListener("click", () => {

    position = i;

    render();

  });

}

/* =========================

   中央の月・太陽

========================= */

const centerObject = createSVG("g");

const centerSymbol = createSVG("g", {}, centerObject);

const phaseLabel = createSVG("text", {

  x: 180,

  y: 236,

  fill: "#f2e6d1",

  "font-size": 17,

  "text-anchor": "middle"

}, centerObject);

const phaseNumber = createSVG("text", {

  x: 180,

  y: 265,

  fill: "#ffffff",

  "font-size": 23,

  "text-anchor": "middle"

}, centerObject);

function drawCenterSymbol() {

  centerSymbol.replaceChildren();

  const isNight = position < 9;

  const index = isNight ? position : position - 9;

  const group = createSVG("g", {

    transform: "translate(180 174) scale(2.25)"

  }, centerSymbol);

  if (isNight) {

    drawMoon(group, index);

  } else {

    drawSun(group, index);

  }

}

/* =========================

   中央背景の昼夜切替

========================= */

function updateSky() {

  const isNight = position < 9;

  if (isNight) {

    // 夜空

    skyTop.setAttribute("stop-color", "#10214d");

    skyBottom.setAttribute("stop-color", "#253f75");

    stars.setAttribute("opacity", "1");

    clouds.setAttribute("opacity", "0");

    phaseLabel.setAttribute("fill", "#f2e6d1");

    phaseNumber.setAttribute("fill", "#ffffff");

  } else {

    // 昼の青空

    skyTop.setAttribute("stop-color", "#327ec4");

    skyBottom.setAttribute("stop-color", "#8dd5f2");

    stars.setAttribute("opacity", "0");

    clouds.setAttribute("opacity", "1");

    phaseLabel.setAttribute("fill", "#ffffff");

    phaseNumber.setAttribute("fill", "#ffffff");

  }

}

/* =========================

   表示更新

========================= */

function render() {

  document.getElementById("hp1").textContent = hp[0];

  document.getElementById("hp2").textContent = hp[1];

  updateSky();

  marks.forEach((halo, i) => {

    if (i === position) {

      halo.setAttribute("stroke", COLORS.gold);

      halo.setAttribute("fill", "#f4d78e18");

    } else {

      halo.setAttribute("stroke", "none");

      halo.setAttribute("fill", "none");

    }

  });

  const isNight = position < 9;

  const number = isNight ? position + 1 : position - 8;

  phaseLabel.textContent = isNight ? "夜" : "昼";

  // 夜5/9は真夜中、昼5/9は真昼

  phaseNumber.textContent = number === 5

    ? (isNight ? "真夜中" : "真昼")

    : `${number} / 9`;

  drawCenterSymbol();

}

/* =========================

   HP操作

========================= */

document.querySelectorAll("[data-player]").forEach(button => {

  button.addEventListener("click", () => {

    const player = Number(button.dataset.player);

    const delta = Number(button.dataset.delta);

    hp[player] = Math.max(

      0,

      Math.min(100, hp[player] + delta)

    );

    render();

  });

});

/* =========================

   戻る

========================= */

document.getElementById("back").addEventListener("click", () => {

  position = (position + 17) % 18;

  render();

});

/* =========================

   進む

========================= */

document.getElementById("forward").addEventListener("click", () => {

  position = (position + 1) % 18;

  render();

});

/* =========================

   すべてリセット

========================= */

document.getElementById("reset").addEventListener("click", () => {

  hp = [100, 100];

  position = 4;

  render();

});

/* =========================

   クロノス盤反転

========================= */

const flipButton = document.getElementById("flip");

flipButton.addEventListener("click", () => {

  isFlipped = !isFlipped;

  svg.classList.toggle("flipped", isFlipped);

  flipButton.setAttribute(

    "aria-pressed",

    String(isFlipped)

  );

});

/* =========================

   画面サイズ自動調整

========================= */

const app = document.getElementById("app");

const viewport = document.getElementById("viewport");

function setVariable(name, value) {

  document.documentElement.style.setProperty(name, value);

}

function fitScreen() {

  const screenWidth = viewport.clientWidth;

  const screenHeight = window.visualViewport

    ? window.visualViewport.height

    : viewport.clientHeight;

  const availableHeight = screenHeight - 10;

  const availableWidth = screenWidth - 4;

  setVariable("--edge", "7px");

  setVariable("--gap", "5px");

  setVariable("--panel-padding", "6px");

  setVariable("--hp-size", "38px");

  setVariable("--hp-button-height", "35px");

  setVariable("--move-height", "42px");

  setVariable("--reset-size", "54px");

  setVariable("--flip-size", "36px");

  app.style.width = screenWidth + "px";

  app.style.transform = "none";

  app.style.left = "0px";

  app.style.top = "0px";

  const maxClock = Math.min(

    availableWidth - 10,

    470

  );

  setVariable("--clock-size", maxClock + "px");

  const fullHeight = app.scrollHeight;

  const otherHeight = fullHeight - maxClock;

  let clockSize = Math.min(

    maxClock,

    availableHeight - otherHeight

  );

  clockSize = Math.max(180, clockSize);

  setVariable("--clock-size", clockSize + "px");

  let contentHeight = app.scrollHeight;

  if (contentHeight > availableHeight) {

    setVariable("--gap", "3px");

    setVariable("--panel-padding", "4px");

    setVariable("--hp-size", "34px");

    setVariable("--hp-button-height", "32px");

    setVariable("--move-height", "38px");

    setVariable("--reset-size", "48px");

    setVariable("--flip-size", "32px");

    const compactHeight = app.scrollHeight;

    const freeSpace = availableHeight - compactHeight;

    clockSize = Math.min(

      maxClock,

      clockSize + Math.max(0, freeSpace)

    );

    setVariable("--clock-size", clockSize + "px");

  }

  contentHeight = app.scrollHeight;

  const scale = Math.min(

    1,

    availableHeight / contentHeight

  );

  app.style.transformOrigin = "top left";

  app.style.transform = `scale(${scale})`;

  const finalWidth = screenWidth * scale;

  const finalHeight = contentHeight * scale;

  app.style.left =

    ((screenWidth - finalWidth) / 2) + "px";

  app.style.top =

    ((screenHeight - finalHeight) / 2) + "px";

}

let fitFrame = null;

function requestFit() {

  if (fitFrame !== null) {

    cancelAnimationFrame(fitFrame);

  }

  fitFrame = requestAnimationFrame(() => {

    fitFrame = null;

    fitScreen();

  });

}

window.addEventListener("resize", requestFit);

if (window.visualViewport) {

  window.visualViewport.addEventListener("resize", requestFit);
